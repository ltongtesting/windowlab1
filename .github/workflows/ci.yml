name: .NET Core CI Pipeline

on:
  push:
    branches: [ master ]
  pull_request:
    branches: [ master ]

jobs:
  build-and-test:
    runs-on: [self-hosted, windows, dotnet-lab]

    steps:
      - name: Extract Source Code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1

      - name: Initialize .NET SDK 8.0
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68
        with:
          dotnet-version: '8.0.x'

      - name: Restore NuGet Dependencies
        run: dotnet restore
        shell: pwsh

      - name: Build Application Structure
        run: dotnet build --configuration Release --no-restore
        shell: pwsh

      - name: Execute xUnit Tests and Calculate Coverage
        run: |
          dotnet test --configuration Release --no-build --verbosity normal `
            /p:CollectCoverage=true `
            /p:CoverletOutputFormat=opencover `
            /p:CoverletOutput=".\TestResults\coverage.opencover.xml"
        shell: pwsh
